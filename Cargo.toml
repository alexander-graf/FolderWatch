[package]
name = "FolderWatch"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31.1"
rfd = "0.14.0"
notify = "6.1.1"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
chrono = "0.4.38"
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
winrt-notification = "0.5.1"